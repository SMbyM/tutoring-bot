services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
      POSTGRES_DB: bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot"]
      interval: 5s
      retries: 10

  # Telegram-адаптер: апдейты, Mini App, доставка outbox в Telegram
  tg:
    build: .
    image: tutoring-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://bot:${POSTGRES_PASSWORD:-bot}@db:5432/bot?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080" # Mini App; наружу — через HTTPS-прокси (Caddy/nginx)
    extra_hosts:
      # прокси/VPN-клиент на хосте доступен из контейнера как host.docker.internal (нужно на Linux)
      - "host.docker.internal:host-gateway"

  # Фоновые задачи. Не ходит в мессенджеры — пишет в outbox. Достаточно одного экземпляра,
  # но второй не навредит: все задачи идемпотентны.
  worker:
    image: tutoring-bot
    pull_policy: never # образ собирается сервисом tg, из реестра его не тянем
    entrypoint: ["/worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://bot:${POSTGRES_PASSWORD:-bot}@db:5432/bot?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
      tg:
        condition: service_started

volumes:
  pgdata:
